version: "2"

linters:
  enable:
    # Essential linters
    - errcheck      # Check for unchecked errors
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Go static analysis (includes gosimple)
    - unused        # Check for unused code

    # Code quality
    - gocyclo       # Cyclomatic complexity
    - misspell      # Spell checking
    - revive        # Fast, configurable linter

    # Best practices
    - bodyclose     # HTTP response body close
    - errname       # Error naming conventions
    - errorlint     # Error wrapping
    - wrapcheck     # Ensure external errors are wrapped with context
    - gosec         # Security issues

  settings:
    gocyclo:
      min-complexity: 30

    revive:
      rules:
        - name: exported
          disabled: false

    wrapcheck:
      # NOTE: setting ignore-sigs REPLACES wrapcheck's built-in defaults
      # (.Errorf(, errors.New(, .Wrap(, ...), so those constructors are
      # re-listed first or fmt.Errorf/errors.New themselves get flagged.
      # Method signatures must use the rendered form "(*pkg.Type).Method",
      # not "pkg.(*Type).Method", or they silently fail to match.
      ignore-sigs:
        # wrapcheck built-in defaults (must be repeated since we override).
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        # Low-level passthroughs that are intentionally leaf errors.
        - encoding/json.MarshalIndent
        - (*encoding/json.Encoder).Encode
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Sscanf
        - gopkg.in/yaml.v3.Marshal
        - gopkg.in/yaml.v3.Unmarshal
        - (*gopkg.in/yaml.v3.Encoder).Encode
        - (*gopkg.in/yaml.v3.Encoder).Close
        - (io.Writer).Write
        - os.Create
        - os.Getwd
        - os.Lstat
        - os.MkdirAll
        - os.ReadFile
        - os.Remove
        - os.Stat
        - os.WriteFile
        - (*os/exec.Cmd).Run
        - path/filepath.Abs
        - path/filepath.Walk
        - time.ParseDuration
        - (*github.com/charmbracelet/bubbletea.Program).Run
      # Errors from our own internal packages carry their own context;
      # wrapcheck targets third-party/stdlib boundaries, not intra-module calls.
      ignore-package-globs:
        - github.com/klauern/skillsync/*

  exclusions:
    paths:
      - vendor

    rules:
      # Exclude error checks in tests
      - path: _test\.go
        linters:
          - errcheck
          - wrapcheck
      # Exclude gosec permissions checks in test files
      - path: _test\.go
        linters:
          - gosec
        text: "G30[16]"
      # Exclude revive var-naming for packages that share stdlib names
      - path: "internal/(parser|sync)"
        linters:
          - revive
        text: "var-naming.*package"
      # QF1008 (remove embedded-field selector) fires 25x across the TUI list
      # models, whose generic-model compat layer (ss-0l9) deliberately writes
      # m.ListModel.<field> to target the embedded base — adjacent lines set
      # shadowed own-fields (table/filtered/filter) where the prefix is
      # mandatory. Simplifying only the unshadowed subset would make the sync
      # blocks inconsistent, so the explicit selector is the intended style.
      - path: "internal/ui/tui/.*_list(_test)?\\.go"
        linters:
          - staticcheck
        text: "QF1008"

run:
  timeout: 5m
  tests: true
