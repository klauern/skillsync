# SkillSync Portability Snapshot
#
# Machine-readable companion to docs/platforms/portability-assessment.md.
# This file is intentionally conservative: it captures the portability claims
# that the narrative docs make today so future checks can compare them
# mechanically.

version: 1
generated_from:
  narrative: docs/platforms/portability-assessment.md
  structured: docs/platforms/schema.yaml

platform_support:
  claude:
    status: implemented
    artifact_surfaces:
      - skills
      - commands
      - agents
      - instructions
    notes:
      - First-class parser and sync support in SkillSync.
  cursor:
    status: implemented
    artifact_surfaces:
      - skills
      - rules
      - commands
    notes:
      - First-class parser and sync support in SkillSync.
  codex:
    status: implemented
    artifact_surfaces:
      - skills
      - instructions
      - config
    notes:
      - First-class parser and sync support in SkillSync.
      - Deprecated custom prompts are compatibility metadata only.
  copilot:
    status: implemented
    artifact_surfaces:
      - instructions
      - prompts
      - agents
    notes:
      - First-class parser and sync support in SkillSync.
      - Supports copilot-instructions.md, .github/prompts/*.prompt.md, .github/instructions/*.md, and .github/agents/*.agent.md.
  gemini:
    status: implemented
    artifact_surfaces:
      - instructions
      - skills
      - commands
      - agents
    notes:
      - First-class parser and sync support in SkillSync.
      - Parses GEMINI.md, skills/*/SKILL.md, and commands/*.toml files.
      - Gemini extensions/hooks/subagents/themes have no cross-platform equivalent and are not sync targets.
  pidev:
    status: implemented
    artifact_surfaces:
      - skills
      - prompts
      - instructions
      - system-prompt layers
    notes:
      - First-class parser and sync support in SkillSync.
      - Packages, extensions, and themes remain out of scope for first-pass sync.

artifact_portability:
  skill:
    portability: high
    description: Core reusable SKILL.md content.
    supported_platforms:
      - claude
      - codex
      - copilot
      - cursor
      - gemini
      - pidev
    notes:
      - Shared skill bodies are the strongest cross-platform unit.
      - Platform-specific metadata lowers fidelity but usually preserves intent.
  command:
    portability: low
    description: Slash commands and prompt artifacts.
    supported_platforms:
      - claude
      - copilot
      - cursor
      - gemini
      - pidev
    notes:
      - SkillSync keeps this in `model.Skill` as transport metadata rather than a separate Codex runtime model.
      - Codex prompt files are compatibility content only in this repo.
      - Gemini extension-bundled commands are content-only first-pass sync inputs, not runtime-equivalent extension behavior.
      - Slash triggers and argument interpolation are not behaviorally portable.
  agent:
    portability: none
    description: Claude subagents and other agent-definition artifacts.
    supported_platforms:
      - claude
      - copilot
      - gemini
    notes:
      - SkillSync does not define a first-class Codex agent artifact.
      - Claude subagents do not map 1:1 to Codex AGENTS.md instructions.
      - Flatten or re-author agent behavior when targeting Codex.
  instructions:
    portability: medium
    description: Always-on instruction files.
    supported_platforms:
      - claude
      - codex
      - copilot
      - cursor
      - gemini
      - pidev
    notes:
      - Similar intent, different loading and precedence models.
      - Instruction files should usually be re-authored, not copied verbatim.

precedence:
  claude:
    - enterprise
    - personal
    - project
  codex:
    - project
    - user
    - admin
  copilot:
    - personal
    - repository
    - organization
  cursor:
    - project
    - global
  gemini:
    - workspace
    - user
    - extension
  pidev:
    - user
    - project

lossy_field_mappings:
  - field: argument-hint
    supported_by:
      - claude
      - copilot
    unsupported_by:
      - codex
      - cursor
      - gemini
      - pidev
    behavior: preserve as metadata only
  - field: allowed-tools
    supported_by:
      - claude
      - codex
      - copilot
      - cursor
    unsupported_by:
      - gemini
      - pidev
    behavior: preserve as intent, not identical enforcement
  - field: gemini extension runtime surfaces
    supported_by:
      - gemini
    unsupported_by:
      - claude
      - codex
      - copilot
      - cursor
      - pidev
    behavior: preserve only safe metadata; mcpServers, hooks, subagents, themes, and package/install state are not first-pass sync targets
  - field: model
    supported_by:
      - claude
      - copilot
    unsupported_by:
      - codex
      - cursor
      - gemini
      - pidev
    behavior: preserve as metadata only
  - field: disable-model-invocation
    supported_by:
      - claude
      - copilot
    unsupported_by:
      - codex
      - cursor
      - gemini
      - pidev
    behavior: preserve as metadata only
  - field: user-invocable
    supported_by:
      - claude
      - copilot
    unsupported_by:
      - codex
      - cursor
      - gemini
      - pidev
    behavior: preserve as metadata only
  - field: context
    supported_by:
      - claude
    unsupported_by:
      - codex
      - copilot
      - cursor
      - gemini
      - pidev
    behavior: Claude-specific subagent forking; no cross-platform equivalent
  - field: hooks
    supported_by:
      - claude
    unsupported_by:
      - codex
      - copilot
      - cursor
      - gemini
      - pidev
    behavior: preserve the Claude hook object as metadata only; lifecycle timing and runtime behavior remain Claude-specific
  - field: applyTo
    supported_by:
      - copilot
    unsupported_by:
      - claude
      - codex
      - cursor
      - gemini
      - pidev
    behavior: no native portable equivalent
  - field: globs
    supported_by:
      - cursor
    unsupported_by:
      - claude
      - codex
      - copilot
      - gemini
      - pidev
    behavior: no native portable equivalent
  - field: SYSTEM.md
    supported_by:
      - pidev
    unsupported_by:
      - claude
      - codex
      - copilot
      - cursor
      - gemini
    behavior: Pi.dev-specific system prompt replacement/append layer; preserve as instruction metadata or re-author manually

nonportable_behaviors:
  - Claude subagents
  - Codex prompt files
  - Slash-trigger behavior
  - Session-specific tool permission policy
  - plugin-specific installation precedence
  - Pi.dev `SYSTEM.md` replacement and `APPEND_SYSTEM.md` append semantics
  - Gemini extension/package/theme installation precedence
  - Gemini extension-only runtime surfaces
  - package/extension/theme installation precedence

source_refs:
  - docs/platforms/claude.md
  - docs/platforms/codex.md
  - docs/platforms/cross-platform-mapping.md
  - docs/platforms/portability-assessment.md
