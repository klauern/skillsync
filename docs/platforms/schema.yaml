# SkillSync portability schema v2. Official references are listed per harness.
version: 2
verified_at: "2026-08-18"
official_sources:
  agentskills: https://agentskills.io/specification
platforms:
  claude:
    name: Claude Code
    write_paths: [.claude/skills, ~/.claude/skills]
    discovery_paths: [.claude/skills, ~/.claude/skills]
    source: https://code.claude.com/docs/en/skills
  codex:
    name: Codex
    write_paths: [.agents/skills, ~/.agents/skills]
    discovery_paths: [.agents/skills, ~/.agents/skills, .codex/skills, ~/.codex/skills, /etc/codex/skills]
    source: https://developers.openai.com/codex/skills
    instructions: AGENTS.md chaining with overrides and fallback
    native_only: [.codex/agents]
  cursor:
    name: Cursor
    write_paths: [.cursor/skills, ~/.cursor/skills]
    discovery_paths: [.cursor/skills, ~/.cursor/skills, .agents/skills, ~/.agents/skills, .claude/skills, ~/.claude/skills, .codex/skills, ~/.codex/skills]
    source: https://cursor.com/docs/skills
    native_only: [.mdc rules, nested AGENTS.md, subagents, hooks, plugins]
  copilot:
    name: GitHub Copilot
    write_paths: [.github/skills, ~/.copilot/skills]
    discovery_paths: [.github/skills, ~/.copilot/skills, .agents/skills, .claude/skills]
    source: https://docs.github.com/en/copilot/concepts/agents/about-agent-skills
  gemini:
    name: Gemini CLI
    write_paths: [.gemini/skills, ~/.gemini/skills]
    discovery_paths: [.agents/skills, ~/.agents/skills, .gemini/skills, ~/.gemini/skills]
    source: https://geminicli.com/docs/cli/skills/
    first_pass_sync:
      supported_artifact_types: [skill, context, command]
      metadata_only_surfaces: [extension.name, extension.version, extension.settings, settings.hooks]
      unsupported_runtime_surfaces: [package, theme, extension.mcpServers, extension.hooks, subagent]
    native_only: [Antigravity extensions, packages, themes, hooks, subagents]
  pi:
    name: Pi
    write_paths: [.pi/skills, ~/.pi/agent/skills]
    discovery_paths: [.pi/skills, ~/.pi/agent/skills, .agents/skills, settings.json.skills]
    source: https://pi.dev/docs/latest/skills
    instructions: AGENTS.md, CLAUDE.md, AGENTS.override.md; trust caveats; /skill:name
capability_boundaries:
  synchronized: [skills, portable instruction content]
  documented_only: [hooks, plugins, packages, custom agents, prompts, settings entries]
  native_only: [runtime lifecycle hooks, installation state, custom agents]
  antigravity: Gemini transition remains documented; adapter retained
mappings:
  skill: [claude, codex, cursor, copilot, gemini, pi]

# Detailed artifact and frontmatter model used by parser and transformer work.
artifact_types:
  skill:
    entrypoint: SKILL.md
    required_frontmatter: [name, description]
    resources: [scripts, references, assets]
  instructions:
    frontmatter: none
    loading: hierarchical or concatenated, platform-dependent
  command:
    formats: [markdown, toml]
    interpolation: platform-native; preserve unsupported syntax as metadata
  agent:
    portability: documented-only/native-only; never imply synchronized custom agents
frontmatter:
  common:
    name: {type: string, required: true}
    description: {type: string, required: true}
  claude: [allowed-tools, argument-hint, disable-model-invocation, user-invocable, model, context, agent, hooks]
  codex: [version, allowed-tools]
  copilot: [tools, argument-hint, model, user-invokable, target, handoffs]
  cursor: [paths, disable-model-invocation, globs (legacy fallback), alwaysApply, description]
  gemini: [name, description]
  pi: [name, description]
field_mappings:
  tools: {claude: allowed-tools, codex: allowed-tools, copilot: tools, cursor: tools, gemini: null, pi: null}
  argument-hint: {claude: argument-hint, codex: null, copilot: argument-hint, cursor: null, gemini: null, pi: null}
  model: {claude: model, codex: null, copilot: model, cursor: null, gemini: null, pi: null}
  globs: {claude: null, codex: null, copilot: applyTo, cursor: globs, gemini: null, pi: null}
  version: {claude: null, codex: version, copilot: null, cursor: null, gemini: null, pi: null}
  handoffs: {claude: null, codex: null, copilot: handoffs, cursor: null, gemini: null, pi: null}
path_defaults:
  skills:
    claude: [.claude/skills, ~/.claude/skills]
    codex: [.agents/skills, ~/.agents/skills, .codex/skills, ~/.codex/skills, /etc/codex/skills]
    cursor: [.cursor/skills, ~/.cursor/skills, .agents/skills, ~/.agents/skills, .claude/skills, ~/.claude/skills, .codex/skills, ~/.codex/skills]
    copilot: [.github/skills, ~/.copilot/skills, .agents/skills, .claude/skills]
    gemini: [.agents/skills, ~/.agents/skills, .gemini/skills, ~/.gemini/skills]
    pi: [.pi/skills, ~/.pi/agent/skills, .agents/skills]
lossy_conversions:
  - field: hooks
    behavior: preserve metadata only; lifecycle and side effects remain native
  - field: custom agents
    behavior: do not synchronize; re-author manually per harness
  - field: argument interpolation
    behavior: preserve literal content; triggers are not auto-converted
  - field: tools / allowed-tools
    behavior: preserve intent where enforcement differs
